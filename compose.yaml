services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: beacon-backend
    environment:
      - DATABASE_PATH=/app/data/beacon.db
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: beacon-frontend
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    depends_on:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: beacon-keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=change-me-in-production
      - KC_DB=dev-file
      - KC_HOSTNAME=127.0.0.1
    command: start-dev
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/realms/master"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  keycloak-data: