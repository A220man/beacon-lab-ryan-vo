# Dependencies are installed via backend/requirements.txt
# This file provides project metadata for the publisher's validation tooling

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-lab"
version = "1.0.0"
description = "AI/ML developer tool for discovering, validating, and indexing agent skills"
authors = [{name = "Ryan Vo", email = "ryandtvo@gmail.com"}]
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["ai", "ai-infrastructure", "agent-skills", "discovery", "fastapi", "react"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/A220man/beacon-lab-ryan-vo"
Repository = "https://github.com/A220man/beacon-lab-ryan-vo"

[tool.setuptools.packages.find]
where = ["backend"]